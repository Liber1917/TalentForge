name: Build Windows exe + installer

# 触发：手动（workflow_dispatch）或打 v* tag 时自动构建。
# 产物：TalentForgeSetup.exe（Inno Setup 安装器，用户可指定安装路径）。
# 注意：PyInstaller 不支持跨平台，Windows 的 exe 必须在 windows-latest 上打。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller cryptography "pydantic>=2.7" "click>=8.1" "fastapi>=0.115" "uvicorn>=0.32" "python-multipart>=0.0.9" "httpx>=0.27" "pypdf>=6.0" "python-docx>=1.1" "beautifulsoup4>=4.12" "jinja2>=3.1"

      - name: Build exe with PyInstaller
        # 直接用 talentforge.spec（datas 为平台无关元组形式），避免 PowerShell 分号分隔符问题
        run: pyinstaller --noconfirm talentforge.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          iscc packaging/installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TalentForge-Windows
          path: |
            dist/TalentForgeSetup*.exe
            dist/talentforge.exe
          if-no-files-found: error
