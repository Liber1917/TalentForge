name: Build Windows exe + installer

# 触发：每次 push（含 PR merge）+ 手动（workflow_dispatch）+ 打 v* tag。
# 产物：① TalentForgeSetup.exe（Inno Setup 安装器，用户可指定安装路径）
#       ② talentforge-extension.zip（浏览器扩展，解压后 Load unpacked）
# 注意：PyInstaller 不支持跨平台，Windows 的 exe 必须在 windows-latest 上打。
# 每次 push 都构建 → 产物始终是最近代码，PR 合并即出新版（无 tag 也分发）。

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node ≥22：vitest 4 的 forks worker 依赖 markAsUncloneable（Node 22+ API），
          # Node 20 会报 "webidl.util.markAsUncloneable is not a function"。24 与本地开发一致。
          node-version: "24"

      - name: Build & test browser extension
        # extension/dist 含 manifest.json（构建脚本已 stage）——Load unpacked 直接指它，
        # zip 内容 = dist/*（manifest 在 zip 根）。
        run: |
          cd extension
          npm ci
          npm test
          npm run build
          Compress-Archive -Path dist/* -DestinationPath ../dist/talentforge-extension.zip -Force

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller cryptography "pydantic>=2.7" "click>=8.1" "fastapi>=0.115" "uvicorn>=0.32" "python-multipart>=0.0.9" "httpx>=0.27" "pypdf>=6.0" "python-docx>=1.1" "beautifulsoup4>=4.12" "jinja2>=3.1"

      - name: Build exe with PyInstaller
        # 直接用 talentforge.spec（datas 为平台无关元组形式），避免 PowerShell 分号分隔符问题
        run: pyinstaller --noconfirm talentforge.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          iscc packaging/installer.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TalentForge-Windows
          path: |
            dist/TalentForgeSetup*.exe
            dist/talentforge.exe
          if-no-files-found: error

      - name: Upload browser extension
        uses: actions/upload-artifact@v4
        with:
          name: talentforge-extension
          path: dist/talentforge-extension.zip
          if-no-files-found: error
